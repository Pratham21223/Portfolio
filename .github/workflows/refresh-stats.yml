name: Refresh Stats

on:
  schedule:
    - cron: "30 18 * * *"  # Everyday at 12:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh stats
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/refresh-stats.mjs

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stats.json
          git diff --cached --quiet || git commit -m "chore: refresh stats $(date -u +'%Y-%m-%d')"
          git push
